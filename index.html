
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIRCLE</title>
<style>
body {
  background: #12051f;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}
.card {
  width: 85%;
  max-width: 360px;
  padding: 25px;
  background: #1d0b30;
  border: 1px solid #9b59b6;
  border-radius: 25px;
  text-align: center;
}
.logo {
  font-size: 75px;
  color: #e9b79a;
  font-weight: bold;
}
h1 {
  color: #e9b79a;
  letter-spacing: 5px;
}
input {
  width: 90%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 12px;
  border: 1px solid #a65bd1;
  background: #10071b;
  color: white;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: 0;
  border-radius: 30px;
  background: #e9b79a;
  color: #18091e;
  font-weight: bold;
}
p { color: #d6b8e8; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">◉ C</div>
  <h1>CIRCLE</h1>
  <p>CONNECT • SHARE • ENJOY</p>

  <input placeholder="Email or Username">
  <input type="password" placeholder="Password">

  <button onclick="alert('CIRCLE Login prototype is working!')">
    LOG IN
  </button>

  <p>Don't have an account?</p>
  <button onclick="alert('Sign Up coming soon!')">
    SIGN UP
  </button>
</div>
</body>
</html>
